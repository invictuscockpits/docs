site_name: Invictus Cockpits Documentation
site_url: https://docs.invictuscockpits.com
repo_url: https://github.com/invictuscockpits/docs
repo_name: invictuscockpits/docs
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/pilot-logo-white.svg
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/invictuscockpits
    - icon: fontawesome/solid/globe
      link: https://invictuscockpits.com

